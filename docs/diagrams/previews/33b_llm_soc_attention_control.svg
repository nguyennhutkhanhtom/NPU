<svg xmlns="http://www.w3.org/2000/svg" width="900" height="895" viewBox="0 0 900 895">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#444444"/></marker></defs>
<rect width="900" height="895" fill="white"/>
<text x="30.00" y="42.00" font-family="Arial" font-size="20" text-anchor="start" fill="#111111" font-weight="bold">llm_soc — attention credits and completion</text>
<text x="30.00" y="66.00" font-family="Arial" font-size="12" text-anchor="start" fill="#666666">Current RTL: pipelined attention value pass</text>
<text x="30.00" y="83.00" font-family="Arial" font-size="12" text-anchor="start" fill="#666666">RTL: llm_soc.sv · clk; raw rst_n → u_reset → core_rst_n</text>
<polyline points="450,201 450,230" fill="none" stroke="#444444" marker-end="url(#arrow)"/>
<polyline points="450,306 450,335" fill="none" stroke="#444444" marker-end="url(#arrow)"/>
<polyline points="450,411 450,440" fill="none" stroke="#444444" marker-end="url(#arrow)"/>
<polyline points="450,516 450,545" fill="none" stroke="#444444" marker-end="url(#arrow)"/>
<polyline points="450,621 450,650" fill="none" stroke="#444444" marker-end="url(#arrow)"/>
<rect x="200" y="125" width="500" height="76" fill="#f8cecc" stroke="#b85450"/>
<text x="450.00" y="158.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Launch when QK scores complete without a fault</text>
<text x="450.00" y="175.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Reset score / request / response / capture / retire counters</text>
<rect x="200" y="230" width="500" height="76" fill="#f8cecc" stroke="#b85450"/>
<text x="450.00" y="263.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Exp output requests V only with a reserved slot available</text>
<text x="450.00" y="280.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">request - capture &lt; 8, or capture frees a slot this clock</text>
<rect x="200" y="335" width="500" height="76" fill="#f8cecc" stroke="#b85450"/>
<text x="450.00" y="368.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">KV responses use slots reserved at request acceptance</text>
<text x="450.00" y="385.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Capture oldest pair; math ready controls operand consumption</text>
<rect x="200" y="440" width="500" height="76" fill="#f8cecc" stroke="#b85450"/>
<text x="450.00" y="473.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Retirement requires both tagged validity and math_product_valid</text>
<text x="450.00" y="490.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Final retired timestep alone does not finish the operator</text>
<rect x="200" y="545" width="500" height="76" fill="#f8cecc" stroke="#b85450"/>
<text x="450.00" y="578.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Normal completion waits for all ownership to drain</text>
<text x="450.00" y="595.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Exp empty; request = response = capture; no operand / product; math idle</text>
<rect x="200" y="650" width="500" height="76" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="450.00" y="683.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Completion permits exact normalization / operator progression</text>
<text x="450.00" y="700.50" font-family="Arial" font-size="12" text-anchor="middle" fill="#111111">Graph completion retains ownership until accepted work drains</text>
<text x="30.00" y="821.00" font-family="Arial" font-size="12" text-anchor="start" fill="#666666">Fault: latch abort ownership, stop new issue and suppress accumulation; drain accepted KV responses and SIMD work.</text>
<text x="30.00" y="838.00" font-family="Arial" font-size="12" text-anchor="start" fill="#666666">Reset cancels validity via core_rst_n and memory/math reset. Fault drain is separate from normal normalization.</text>
<text x="30.00" y="881.00" font-family="Arial" font-size="11" text-anchor="start" fill="#666666">Red: control · Yellow: interface · Gray: registers / buffers · Blue: compute / output · Purple: memory / technology</text>
</svg>
