<text x="498.50" y="921.00" font-family="Arial" font-size="11" text-anchor="middle" fill="#111111">one clock</text>
<text x="30.00" y="1096.00" font-family="Arial" font-size="11" text-anchor="start" fill="#666666">Red: control · Yellow: interface · Gray: registers / buffers · Blue: compute / output · Purple: memory / technology</text>
